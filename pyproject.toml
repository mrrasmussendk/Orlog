[project]
name = "orlog"
version = "0.0.3"
description = "A spec-with-a-runtime for trustworthy AI agent memory."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.11 is the floor the spec states (§B1) and the floor the code now needs:
# config.py reads orlog.toml with stdlib `tomllib`, and server_tools parses a
# "Z"-suffixed timestamp with datetime.fromisoformat -- both 3.11 features
# that had backport shims around them while this said 3.10.
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    # Upper-bounded deliberately: mcp 2.x renamed FastMCP to MCPServer and
    # changed other APIs, so server.py (which imports mcp.server.fastmcp)
    # cannot import under it. An unbounded ">=1.0" silently became a broken
    # install the day 2.x shipped -- nothing in this repo changed. Lift the
    # bound together with the migration to the MCPServer API.
    "mcp>=1.0,<2",
    "python-ulid>=2",
    "cryptography>=41",
    "tomli-w>=1",
    "fastembed>=0.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8",
]
benchmark = [
    "mem0ai>=2.0",
]
build = [
    "pyinstaller>=6.0",
    "pyinstaller-hooks-contrib>=2024.0",
]

[project.scripts]
orlog = "orlog.cli:main"

# The three seams a profile extends orlog through (spec §B12). orlog declares
# no entry points of its own in these groups -- core's event types,
# projections and tools are wired in code, because they are normative. The
# groups exist so an installed profile (e.g. the Mimir agent-memory profile)
# can register its own without forking core; tests/fixtures/ships a reference
# plugin that exercises all three.
#
# [project.entry-points."orlog.event_types"]
# mimir = "mimir.event_types:EVENT_TYPES"
# [project.entry-points."orlog.projections"]
# mimir = "mimir.projections:PROJECTIONS"
# [project.entry-points."orlog.tools"]
# mimir = "mimir.tools:TOOLS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The spec ships WITH the package: server.py serves it as the orlog://spec
# MCP resource, and resolving it relative to the source tree meant that
# resource was empty for every install that wasn't a git checkout.
[tool.setuptools.package-data]
orlog = ["spec_data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration and not perf"]
pythonpath = ["."]
markers = [
    "integration: makes real Anthropic API calls; requires ANTHROPIC_API_KEY, skipped otherwise",
    "perf: builds a 100k-event workspace to measure §B12.4's scan budget; minutes, not seconds",
]
