name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The release version comes from the tag (see the packaging steps below),
  # not from pyproject.toml -- which is exactly how pyproject drifted to
  # 0.1.0 while the actual releases were 0.0.1 and v0.0.2, with nothing to
  # notice. Fail the release rather than ship a binary whose version
  # disagrees with the package metadata inside it.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: tomllib is 3.11+, and the runner default is not guaranteed
      - name: Tag must match pyproject.toml version
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag_version pyproject=$pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $pyproject_version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64
            bin_name: orlog.exe
          - os: macos-latest
            asset_os: macos
            asset_arch: arm64  # macos-latest runners are Apple Silicon
            bin_name: orlog
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            bin_name: orlog
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install orlog and build tooling
        run: python -m pip install -e ".[anthropic,openai,dev,build]"

      - name: Build standalone binary
        run: pyinstaller orlog.spec

      - name: Smoke test the built binary
        run: python packaging/smoke_test.py dist/${{ matrix.bin_name }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "out/orlog-$version-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cd dist
          zip -r "../out/orlog-${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip" "${{ matrix.bin_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: orlog-${{ matrix.asset_os }}
          path: out/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
