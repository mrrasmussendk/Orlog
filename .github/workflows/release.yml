name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The release version comes from the tag (see the packaging steps below),
  # not from pyproject.toml -- which is exactly how pyproject drifted to
  # 0.1.0 while the actual releases were 0.0.1 and v0.0.2, with nothing to
  # notice. Fail the release rather than ship a binary whose version
  # disagrees with the package metadata inside it.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: tomllib is 3.11+, and the runner default is not guaranteed
      - name: Tag must match pyproject.toml version
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag_version pyproject=$pyproject_version"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $pyproject_version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      # One row per binary a user can download. PyInstaller cannot
      # cross-compile, so each platform/arch needs its own runner -- which
      # is why the two rows below exist: without them the Homebrew formula
      # `odie`s on Intel macOS and arm64 Linux and sends those users to
      # PyPI, and anyone on an ARM server or in a Docker container on an
      # Apple Silicon Mac has no binary at all.
      #
      # Windows arm64 is deliberately absent: `windows-11-arm` runners
      # exist, but setup-python's arm64 coverage is newer than this
      # project's 3.11 floor, and a row that fails blocks the `release`
      # job (which needs ALL of `build`) from publishing anything.
      matrix:
        include:
          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64
            bin_name: orlog.exe
          - os: macos-latest
            asset_os: macos
            asset_arch: arm64  # macos-latest runners are Apple Silicon
            bin_name: orlog
          - os: macos-13
            asset_os: macos
            asset_arch: x86_64  # the last Intel macOS runner image
            bin_name: orlog
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            bin_name: orlog
          - os: ubuntu-24.04-arm
            asset_os: linux
            asset_arch: arm64
            bin_name: orlog
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must be >= pyproject's requires-python; 3.10 silently stopped
          # being installable the moment that floor moved to 3.11.
          python-version: "3.11"

      - name: Install orlog and build tooling
        run: python -m pip install -e ".[anthropic,openai,dev,build]"

      - name: Build standalone binary
        run: pyinstaller orlog.spec

      - name: Smoke test the built binary
        run: python packaging/smoke_test.py dist/${{ matrix.bin_name }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "dist/${{ matrix.bin_name }}" -DestinationPath "out/orlog-$version-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cd dist
          zip -r "../out/orlog-${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip" "${{ matrix.bin_name }}"

      - uses: actions/upload-artifact@v4
        with:
          # Must include the arch: two rows now share an asset_os, and
          # upload-artifact@v4 fails on a duplicate artifact name rather
          # than merging into it the way v3 did.
          name: orlog-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: out/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
