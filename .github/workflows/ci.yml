name: CI

on:
  push:
    # Ref matching is case-sensitive, and this repo's default branch is
    # "Main" -- so a lowercase-only list meant pushes to it never ran CI.
    branches: [Main, main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor pyproject declares (spec §B1): config.py reads
        # orlog.toml with stdlib tomllib and server_tools parses a
        # "Z"-suffixed timestamp with fromisoformat, both 3.11 features.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The LLM adapter tests construct real provider exception types
      # (openai.APITimeoutError, anthropic's equivalents), so the optional
      # provider extras are required for the suite to run, not just to pass.
      - run: python -m pip install -e ".[anthropic,openai,dev]"
      - run: pytest
