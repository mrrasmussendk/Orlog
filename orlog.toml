[workspace]
name = "Orlog"
mode = "conformant"

[deriver]
backend = "scripted"
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 400
timeout_s = 30

[retrieval]
k = 8
embedder = "BAAI/bge-small-en-v1.5"
# bge-small has a non-trivial baseline cosine similarity even between
# unrelated sentences (observed ~0.21-0.29 for genuinely unrelated queries
# vs ~0.38-0.53 for real matches, in ad hoc calibration) -- 0.35 sits
# clearly above that noise floor. The global default (0.15) is tuned for
# the dependency-free HashingEmbedder used in tests, not this real model.
min_confidence = 0.35
# Real embeddings cluster two same-topic-different-detail candidates (e.g.
# two "Anna"s) much closer together than the crude default heuristic
# assumed: a query that actually NAMES the disambiguating entity_detail
# still only pulls the runner-up down to ~76-89% of the top score, while a
# genuinely ambiguous query (no detail mentioned) sits at ~95%+. 0.90
# separates the two in ad hoc calibration; the global default (0.85) was
# tuned before this model was in the loop and is too eager to call
# "ambiguous" here.
ambiguity_margin = 0.90

[verifier]
backend = "windows"

[projections.supersession_chains]
grouping = "entity+type"
keep_versions = 2

[adaptation]
pass_bonus = 0.5
correction_bonus = 1.0
daily_decay = 0.99

[cache]
max_entries = 10000

[privacy]
detectors = [
    "regex",
]
resolve_entities = false
